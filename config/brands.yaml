# จับกลุ่มร้านเป็น "แบรนด์" + กำหนด "ชื่อมาตรฐาน" ที่ใช้ในรายงานทุกที่
#
# `name` ของแต่ละแบรนด์ = ชื่อมาตรฐาน (ชื่อที่เจ้าของงานกำหนด)
#   · ใน Excel        ใช้ชื่อมาตรฐานอย่างเดียว
#   · ในอีเมล         ใช้ "ชื่อมาตรฐาน (ชื่อจริงบนแพลตฟอร์ม)" เมื่อ 2 ชื่อไม่ตรงกัน
#                     เช่น "Powerstools (powerstool)" จะได้รู้ว่าดึงมาจากร้านไหนจริง ๆ
# `display_name` ใน shops.yaml = ชื่อจริงที่ปรากฏบนหลังบ้านของแพลตฟอร์มนั้น ห้ามแก้ให้ตรงกัน
#   เพราะโค้ดใช้จับคู่ร้านตอนสลับร้านบน Shopee
#
# ร้านเดียวกันขายหลายแพลตฟอร์ม แต่ชื่อร้านบนแต่ละเจ้าสะกดไม่เหมือนกันเป๊ะ
# จับกลุ่มอัตโนมัติด้วยชื่อจึงพลาดได้ ไฟล์นี้จึงประกาศไว้ให้ชัดเจน
#
# ⚠️ ห้ามเดาเอาเองว่าร้านไหนเป็นแบรนด์เดียวกัน — ต้องได้รับการยืนยันจากเจ้าของงาน
#    ถ้ารวมผิด ยอดขายของคนละร้านจะถูกบวกรวมกันโดยไม่มีอะไรเตือน
#
# ที่มา: เจ้าของงานยืนยัน 2026-08-06 ว่า powerstool (TikTok) กับ
#        Powerstools (Shopee) เป็นร้านเดียวกัน
#        เจ้าของงานยืนยัน 2026-08-07 ว่า Toolspartner กับ TNLTOOLSTORE
#        เป็นร้านเดียวกัน (ทั้งคู่อยู่บน Shopee บัญชี tnltools เดียวกัน)

brands:
  - name: "กัปตัน เอกสตีล"
    shops: [lazada_01, shopee_06]

  - name: "Powerstools"
    shops: [tiktok_01, shopee_04]     # ชื่อบน TikTok สะกด powerstool ไม่มี s

  - name: "เฮียเก๋า เครื่องมือช่างราคาถูก"
    shops: [tiktok_05, shopee_05]

  - name: "toolsdee1"
    shops: [tiktok_02]

  - name: "ฝ้ายการช่าง"
    shops: [tiktok_03]

  # ชื่อจริงบน TikTok คือ "100อัน1000อย่าง88" — เจ้าของงานให้ตัด 88 ออกในรายงาน
  - name: "100อัน1000อย่าง"
    shops: [tiktok_04]

  - name: "เฮียคิมคลองถม"
    shops: [shopee_01]

  - name: "Smarttooltech"
    shops: [shopee_02, lazada_03]     # เพิ่มหน้าร้าน Lazada 2026-08-09

  # shopee_03/08 อยู่บน Shopee ทั้งคู่ ใช้บัญชี tnltools เดียวกัน
  # ชื่อจริงคือ Toolspartner กับ TNLTOOLSTORE — เจ้าของงานให้ใช้ TNLTOOLSTORE
  # lazada_02 คือหน้าร้าน Lazada ของแบรนด์เดียวกัน เพิ่ม 2026-08-09
  - name: "TNLTOOLSTORE"
    shops: [shopee_03, shopee_08, lazada_02]

  # ── ร้านใหม่ 2026-08-09 ──────────────────────────────────
  # เจ้าของงานยืนยัน 2026-08-10 ว่า 2 หน้าร้านนี้เป็นร้านเดียวกัน
  # ชื่อจริงบนเว็บคือ Superhomefactory กับ DIY tools ขายเครื่องมือช่าง
  # ให้ใช้ชื่อรวมว่า "นาดา" — อีเมลจะขึ้น "นาดา (Superhomefactory)" เป็นต้น
  - name: "นาดา"
    shops: [shopee_09, shopee_10]

  - name: "Jumbo A"
    shops: [shopee_11]
