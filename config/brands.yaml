# จับกลุ่มร้านเป็น "แบรนด์" + กำหนด "ชื่อมาตรฐาน" ที่ใช้ในรายงานทุกที่
#
# `name` ของแต่ละแบรนด์ = ชื่อมาตรฐาน (ชื่อที่เจ้าของงานกำหนด)
#   · ใน Excel        ใช้ชื่อมาตรฐานอย่างเดียว
#   · ในอีเมล         ใช้ "ชื่อมาตรฐาน (ชื่อจริงบนแพลตฟอร์ม)" เมื่อ 2 ชื่อไม่ตรงกัน
#                     เช่น "Powerstools (powerstool)" จะได้รู้ว่าดึงมาจากร้านไหนจริง ๆ
# `display_name` ใน shops.yaml = ชื่อจริงที่ปรากฏบนหลังบ้านของแพลตฟอร์มนั้น ห้ามแก้ให้ตรงกัน
#   เพราะโค้ดใช้จับคู่ร้านตอนสลับร้านบน Shopee
#
# ร้านเดียวกันขายหลายแพลตฟอร์ม แต่ชื่อร้านบนแต่ละเจ้าสะกดไม่เหมือนกันเป๊ะ
# จับกลุ่มอัตโนมัติด้วยชื่อจึงพลาดได้ ไฟล์นี้จึงประกาศไว้ให้ชัดเจน
#
# ⚠️ ห้ามเดาเอาเองว่าร้านไหนเป็นแบรนด์เดียวกัน — ต้องได้รับการยืนยันจากเจ้าของงาน
#    ถ้ารวมผิด ยอดขายของคนละร้านจะถูกบวกรวมกันโดยไม่มีอะไรเตือน
#
# ที่มา: เจ้าของงานยืนยัน 2026-08-06 ว่า powerstool (TikTok) กับ
#        Powerstools (Shopee) เป็นร้านเดียวกัน
#        เจ้าของงานยืนยัน 2026-08-07 ว่า Toolspartner กับ TNLTOOLSTORE
#        เป็นร้านเดียวกัน (ทั้งคู่อยู่บน Shopee บัญชี tnltools เดียวกัน)

brands:
  - name: "กัปตัน เอกสตีล"
    shops: [lazada_01, shopee_06]

  - name: "Powerstools"
    shops: [tiktok_01, shopee_04]     # ชื่อบน TikTok สะกด powerstool ไม่มี s

  - name: "เฮียเก๋า เครื่องมือช่างราคาถูก"
    shops: [tiktok_05, shopee_05]

  - name: "toolsdee1"
    shops: [tiktok_02]

  - name: "ฝ้ายการช่าง"
    shops: [tiktok_03]

  # ชื่อจริงบน TikTok คือ "100อัน1000อย่าง88" — เจ้าของงานให้ตัด 88 ออกในรายงาน
  - name: "100อัน1000อย่าง"
    shops: [tiktok_04]

  - name: "เฮียคิมคลองถม"
    shops: [shopee_01]

  - name: "Smarttooltech"
    shops: [shopee_02, lazada_03]     # เพิ่มหน้าร้าน Lazada 2026-08-09

  # shopee_03/08 อยู่บน Shopee ทั้งคู่ ใช้บัญชี tnltools เดียวกัน
  # ชื่อจริงคือ Toolspartner กับ TNLTOOLSTORE — เจ้าของงานให้ใช้ TNLTOOLSTORE
  # lazada_02 คือหน้าร้าน Lazada ของแบรนด์เดียวกัน เพิ่ม 2026-08-09
  - name: "TNLTOOLSTORE"
    shops: [shopee_03, shopee_08, lazada_02]

  # ── ร้านใหม่ 2026-08-09 ──────────────────────────────────
  # ⚠️ แก้ 2026-08-13 — เดิมรวม shopee_09 กับ shopee_10 เป็น "นาดา" ก้อนเดียว
  #    ตารางของทีมชี้ว่าเป็นคนละ dealer คนละนิติบุคคล เจ้าของงานยืนยันแล้ว
  #      shopee_09  Superhomefactory            AR-0214    บริษัท นาดา อินเตอร์ กรุ๊ป
  #      shopee_10  DIY tools ขายเครื่องมือช่าง   AR-0266-1  บริษัท สหพานิช 2547
  #    รวมกันแล้วยอดจะไปกองที่ dealer เดียว ทั้งที่ต้องแยกบิลกัน
  - name: "นาดา"
    shops: [shopee_09]

  - name: "DIY Tool"
    shops: [shopee_10]

  - name: "Jumbo A"
    shops: [shopee_11]

  # ═══════════════════════════════════════════════════════════
  #  ร้าน Official OSUKA 16 ร้าน — รวมเป็น "1 ชื่อต่อ 1 แพลตฟอร์ม"
  # ═══════════════════════════════════════════════════════════
  # ✅ เจ้าของงานตัดสิน 2026-08-19: รวมทุกร้านในแพลตฟอร์มเดียวกันให้เหลือชื่อเดียว
  #    แยกเป็น 3 ชื่อตามแพลตฟอร์ม ไม่ใช่ยุบเป็นก้อนเดียวทั้งหมด
  #
  # ⚠️ ต่างจากกลุ่ม dealer ข้างบนตรงที่กลุ่มนั้น 1 แบรนด์ = 1 ร้านค้าจริง
  #    ส่วนกลุ่มนี้เป็นหน้าร้าน Official ของ OSUKA เองหลายหน้าร้านในแพลตฟอร์มเดียวกัน
  #    ยอดจึงถูกรวมโดยตั้งใจ ไม่ใช่การรวมผิด
  #
  # ⚠️ รวมแค่ "ชื่อที่ใช้ในรายงาน" เท่านั้น — shop_id ยังแยกกันเหมือนเดิมทุกร้าน
  #    ไฟล์ Excel ยังออกแยกรายร้าน · ในฐานยังแยก shop_id · เจาะดูรายร้านได้ครบ
  #    ที่รวมคือชั้นบนสุดที่คนอ่าน ไม่ใช่ตัวข้อมูล
  #
  # ⚠️ ทั้ง 16 ร้านยัง enabled: false ใน shops.yaml รอล็อกอิน 2026-08-20
  #    ประกาศไว้ล่วงหน้าเพื่อให้เปิดใช้แล้วมีชื่อมาตรฐานทันที ไม่ต้องมาแก้ทีหลัง
  - name: "Lazada Official OSUKA"
    shops: [lazada_04, lazada_05, lazada_06, lazada_07,
            lazada_08, lazada_09, lazada_10, lazada_11]

  - name: "Shopee Official OSUKA"
    shops: [shopee_12, shopee_13, shopee_14, shopee_15,
            shopee_16, shopee_17, shopee_18]

  - name: "Tiktok Official OSUKA"
    shops: [tiktok_07]

  # ── ร้านใหม่ 2026-08-18 ──────────────────────────────────
  # ✅ เจ้าของงานยืนยัน 2026-08-19: Metool เป็นร้านเดี่ยว ไม่ผูกกับแบรนด์ไหน
  #    ห้ามรวมเข้ากับแบรนด์อื่นเองโดยไม่ถาม
  #
  # ⚠️ ร้านนี้ต่างจากร้านอื่นในกลุ่มมาก — ขายของใช้ทั่วไปกับอะไหล่รถ
  #    (ถุงพลาสติก เทป ยางจักรยาน สายไฟ ยาขัดเงา) สินค้า OSUKA แค่ 4.1%
  #    ตรวจแล้ว 2026-08-19 ว่าเป็นตัวเลขจริง ไม่ใช่การจับคู่ผิด
  - name: "Metool"
    shops: [tiktok_06]
