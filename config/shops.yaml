# ─────────────────────────────────────────────────────────────
#  ร้านที่มีอยู่จริงตอนนี้: Lazada 1 + TikTok 5 = 6 ร้าน
#  (Shopee ยังไม่มีร้าน — เพิ่มทีหลังได้ ดูตัวอย่างท้ายไฟล์)
#
#  ⚠️ ห้ามใส่รหัสผ่านในไฟล์นี้เด็ดขาด ไฟล์นี้ถูก commit ขึ้น git
#     อีเมลที่ใช้ล็อกอินอยู่ใน .env (ไม่ถูก commit) อ้างผ่าน account_key
#
#  platform : แพลตฟอร์มจริง (ใช้ตั้งชื่อไฟล์ + rate limit + column map)
#  adapter  : mock = ข้อมูลปลอม | playwright = กดปุ่ม Export จริง | api = Official API
#             → เปลี่ยนบรรทัดนี้บรรทัดเดียวเพื่อสลับวิธีดึง ไม่ต้องแตะโค้ด
#  enabled  : false = ข้ามร้านนี้ ขึ้น SKIPPED (⚪ เทา) ไม่ใช่ FAILED (🔴 แดง)
# ─────────────────────────────────────────────────────────────

shops:
  # ── Lazada ────────────────────────────────────────────────
  - shop_id: lazada_01
    platform: lazada
    adapter: playwright
    display_name: "กัปตัน เอกสตีล"
    account_key: LAZADA_01
    enabled: true

  # ── TikTok Shop ───────────────────────────────────────────
  - shop_id: tiktok_01
    platform: tiktok
    adapter: playwright
    display_name: "powerstool"
    account_key: TIKTOK_01
    enabled: true

  - shop_id: tiktok_02
    platform: tiktok
    adapter: playwright
    display_name: "toolsdee1"
    account_key: TIKTOK_02
    enabled: true

  - shop_id: tiktok_03
    platform: tiktok
    adapter: playwright
    display_name: "ฝ้ายการช่าง"
    account_key: TIKTOK_03
    enabled: true

  - shop_id: tiktok_04
    platform: tiktok
    adapter: playwright
    display_name: "100อัน1000อย่าง88"
    account_key: TIKTOK_04
    enabled: true

  - shop_id: tiktok_05
    platform: tiktok
    adapter: playwright
    display_name: "เฮียเก๋าเครื่องมือช่าง ราคาถูก"
    account_key: TIKTOK_05
    enabled: true

  # ── Shopee: 7 ร้าน ────────────────────────────────────────
  #
  # ⚠️ ทั้ง 7 ร้านตั้ง enabled: false ไว้ก่อน — ตั้งใจ ไม่ใช่ลืม
  #    ยังไม่มีขั้นตอน Export ของ Shopee (ดู src/adapters/shopee.py)
  #    ถ้าเปิดใช้ตอนนี้จะขึ้น 🔴 FAILED ทุกวันจนสีแดงเฝือ
  #    ปิดไว้จะขึ้น ⚪ SKIPPED พร้อมเหตุผลบน Dashboard
  #
  # ล็อกอินเก็บ session ได้เลยตั้งแต่ตอนนี้ (ไม่ต้องรอโค้ด Export เสร็จ):
  #    python -m src.cli login --shop shopee_01
  #
  # พอทำ column map เสร็จแล้วค่อยเปลี่ยนเป็น adapter: playwright + enabled: true

  - shop_id: shopee_01
    platform: shopee
    adapter: mock
    display_name: "เฮียคิมคลองถม"
    account_key: SHOPEE_01
    enabled: false
    skip_reason: "รอขั้นตอน Export ของ Shopee (ยังไม่มี column map)"

  - shop_id: shopee_02
    platform: shopee
    adapter: playwright
    display_name: "Smarttooltech"
    web_shop_name: "Smarttooltech"
    account_key: SHOPEE_02
    enabled: true

  # ⚠️ บัญชี tnltools:setadosuka ดูแล 2 ร้าน (Toolspartner + TNLTOOLSTORE)
  #    Shopee มีหน้า /portal/shop "เลือกร้านที่จะจัดการ" คั่นหลังล็อกอิน
  #    2 ร้านนี้จึงใช้ profile_key เดียวกัน = ล็อกอินครั้งเดียวได้ทั้งคู่
  #    แต่แยกเป็นคนละ shop_id เพื่อให้ออก Excel คนละไฟล์ ชื่อร้านไม่ปนกัน
  - shop_id: shopee_03
    platform: shopee
    adapter: mock
    display_name: "Toolspartner"
    web_shop_name: "Toolspartner"
    profile_key: shopee_03
    account_key: SHOPEE_03
    enabled: false
    skip_reason: "รอขั้นตอน Export ของ Shopee (ยังไม่มี column map)"

  - shop_id: shopee_08
    platform: shopee
    adapter: mock
    display_name: "TNLTOOLSTORE"
    web_shop_name: "TNLTOOLSTORE"
    profile_key: shopee_03          # ใช้ session เดียวกับ Toolspartner
    account_key: SHOPEE_03
    enabled: false
    skip_reason: "รอขั้นตอน Export ของ Shopee (ยังไม่มี column map)"

  - shop_id: shopee_04
    platform: shopee
    adapter: mock
    display_name: "Powerstools"
    account_key: SHOPEE_04
    enabled: false
    skip_reason: "รอขั้นตอน Export ของ Shopee (ยังไม่มี column map)"

  - shop_id: shopee_05
    platform: shopee
    adapter: mock
    display_name: "เฮียเก๋า เครื่องมือช่างราคาถูก"
    account_key: SHOPEE_05
    enabled: false
    skip_reason: "รอขั้นตอน Export ของ Shopee (ยังไม่มี column map)"

  - shop_id: shopee_06
    platform: shopee
    adapter: mock
    display_name: "กัปตัน เอกสตีล"
    account_key: SHOPEE_06
    enabled: false
    skip_reason: "รอขั้นตอน Export ของ Shopee (ยังไม่มี column map)"

  # ⚠️ บัญชี YM_SP:Osuka ดูแล 3 ร้าน — ใช้ profile_key เดียวกันทั้งหมด
  #    ตอนแรกใน shops.yaml มีแค่ "ยงเฮ้าส์ (Mall)" ร้านเดียว
  #    ตรวจหน้าเลือกร้านจริงแล้วเจอ 3 ร้าน จึงแตกออกมาให้ครบ
  #    web_shop_name ต้องตรงกับที่โชว์บนหน้าเว็บเป๊ะ ๆ ถึงจะกดถูกแถว
  - shop_id: shopee_07
    platform: shopee
    adapter: mock
    display_name: "Yonghouse Official Store"      # ตัว Mall (Shopee เรียก Official Store)
    web_shop_name: "Yonghouse Official Store"
    profile_key: shopee_07
    account_key: SHOPEE_07
    enabled: false
    skip_reason: "รอขั้นตอน Export ของ Shopee (ยังไม่มี column map)"

  - shop_id: shopee_09
    platform: shopee
    adapter: mock
    display_name: "Yong House ยงเฮ้าส์"
    web_shop_name: "Yong House ยงเฮ้าส์"
    profile_key: shopee_07          # ใช้ session เดียวกับ Yonghouse Official Store
    account_key: SHOPEE_07
    enabled: false
    skip_reason: "รอขั้นตอน Export ของ Shopee (ยังไม่มี column map)"

  - shop_id: shopee_10
    platform: shopee
    adapter: mock
    display_name: "บ้านช่าง Baanchang"
    web_shop_name: "บ้านช่าง Baanchang"
    profile_key: shopee_07          # ใช้ session เดียวกับ Yonghouse Official Store
    account_key: SHOPEE_07
    enabled: false
    skip_reason: "รอขั้นตอน Export ของ Shopee (ยังไม่มี column map)"
