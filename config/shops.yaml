# ─────────────────────────────────────────────────────────────
#  ร้านที่มีอยู่จริงตอนนี้: Lazada 1 + TikTok 5 + Shopee 10 = 16 ร้าน
#
#  ⚠️ Shopee 10 ร้าน มาจาก 7 บัญชี — 1 บัญชีดูแลได้หลายร้าน
#     ร้านที่อยู่ใต้บัญชีเดียวกันใช้ profile_key เดียวกัน = ล็อกอินครั้งเดียวพอ
#     แต่แยก shop_id เพื่อออก Excel คนละไฟล์ ชื่อร้านไม่ปนกัน
#
#  ⚠️ ห้ามใส่รหัสผ่านในไฟล์นี้เด็ดขาด ไฟล์นี้ถูก commit ขึ้น git
#     อีเมลที่ใช้ล็อกอินอยู่ใน .env (ไม่ถูก commit) อ้างผ่าน account_key
#
#  platform : แพลตฟอร์มจริง (ใช้ตั้งชื่อไฟล์ + rate limit + column map)
#  adapter  : mock = ข้อมูลปลอม | playwright = กดปุ่ม Export จริง | api = Official API
#             → เปลี่ยนบรรทัดนี้บรรทัดเดียวเพื่อสลับวิธีดึง ไม่ต้องแตะโค้ด
#  enabled  : false = ข้ามร้านนี้ ขึ้น SKIPPED (⚪ เทา) ไม่ใช่ FAILED (🔴 แดง)
# ─────────────────────────────────────────────────────────────

shops:
  # ── Lazada ────────────────────────────────────────────────
  - shop_id: lazada_01
    platform: lazada
    adapter: playwright
    display_name: "กัปตัน เอกสตีล"
    account_key: LAZADA_01
    enabled: true

  # เพิ่ม 2026-08-09 — 2 ร้านนี้เป็นหน้าร้าน Lazada ของแบรนด์ที่มีบน Shopee อยู่แล้ว
  # ชื่อมาตรฐานจึงต้องตรงกับของเดิม (ดู config/brands.yaml)
  #
  # ⚠️ ปิดไว้ 2026-08-10 — ติดสิทธิ์ ไม่ใช่บั๊กและไม่ใช่ session
  #    ล็อกอินผ่าน (Chrome จำรหัสไว้แล้ว ต่ออายุเองได้) แต่บัญชีไม่มีสิทธิ์ดูคำสั่งซื้อ
  #    ระบบคืน NO_PERMISSION ซึ่งเป็น error ที่ห้าม retry — ยิงซ้ำก็ไม่ผ่าน
  #
  #    ทำไมต้องปิดแทนที่จะปล่อยให้แดง: กฎ "ไม่ครบทุกร้านห้ามส่งเมล" นับเฉพาะ FAILED
  #    ถ้าปล่อยไว้ อีเมลจะไม่ออกเลยทุกวันจนกว่าจะแก้สิทธิ์เสร็จ
  #    ปิดแล้วขึ้น SKIPPED สีเทา อีเมลออกปกติ แต่ยังเห็นบน Dashboard ว่าค้างอยู่
  #
  #    เปิดกลับเมื่อ: เจ้าของร้านเพิ่มสิทธิ์ "จัดการคำสั่งซื้อ" ให้บัญชีที่เราใช้
  - shop_id: lazada_02
    platform: lazada
    adapter: playwright
    display_name: "TNLTOOLSTORE"
    account_key: LAZADA_02
    enabled: false
    skip_reason: "รอเจ้าของร้านเพิ่มสิทธิ์ดูคำสั่งซื้อ (NO_PERMISSION 2026-08-10)"

  - shop_id: lazada_03
    platform: lazada
    adapter: playwright
    display_name: "Smarttooltech"
    account_key: LAZADA_03
    enabled: false
    skip_reason: "รอเจ้าของร้านเพิ่มสิทธิ์ดูคำสั่งซื้อ (NO_PERMISSION 2026-08-10)"

  # ── TikTok Shop ───────────────────────────────────────────
  - shop_id: tiktok_01
    platform: tiktok
    adapter: playwright
    display_name: "powerstool"
    account_key: TIKTOK_01
    enabled: true

  - shop_id: tiktok_02
    platform: tiktok
    adapter: playwright
    display_name: "toolsdee1"
    account_key: TIKTOK_02
    enabled: true

  - shop_id: tiktok_03
    platform: tiktok
    adapter: playwright
    display_name: "ฝ้ายการช่าง"
    account_key: TIKTOK_03
    enabled: true

  - shop_id: tiktok_04
    platform: tiktok
    adapter: playwright
    display_name: "100อัน1000อย่าง88"
    account_key: TIKTOK_04
    enabled: true

  - shop_id: tiktok_05
    platform: tiktok
    adapter: playwright
    display_name: "เฮียเก๋าเครื่องมือช่าง ราคาถูก"
    account_key: TIKTOK_05
    enabled: true

  # ── Shopee: 10 ร้าน จาก 7 บัญชี ───────────────────────────
  #
  # web_shop_name = ชื่อร้านบนหน้า /portal/shop "เลือกร้านที่จะจัดการ"
  #                 ต้องตรงเป๊ะถึงจะกดถูกแถว (ไม่ใส่ = ใช้ display_name)
  # profile_key   = ใช้โปรไฟล์/session ร่วมกับร้านอื่น (ไม่ใส่ = ใช้ shop_id ตัวเอง)
  #
  # ล็อกอิน: python -m src.cli login --shop shopee_01

  - shop_id: shopee_01
    platform: shopee
    adapter: playwright
    display_name: "เฮียคิมคลองถม"
    account_key: SHOPEE_01
    enabled: true

  - shop_id: shopee_02
    platform: shopee
    adapter: playwright
    display_name: "Smarttooltech"
    web_shop_name: "Smarttooltech"
    account_key: SHOPEE_02
    enabled: true

  # ⚠️ บัญชี tnltools:setadosuka ดูแล 2 ร้าน (Toolspartner + TNLTOOLSTORE)
  #    Shopee มีหน้า /portal/shop "เลือกร้านที่จะจัดการ" คั่นหลังล็อกอิน
  #    2 ร้านนี้จึงใช้ profile_key เดียวกัน = ล็อกอินครั้งเดียวได้ทั้งคู่
  #    แต่แยกเป็นคนละ shop_id เพื่อให้ออก Excel คนละไฟล์ ชื่อร้านไม่ปนกัน
  - shop_id: shopee_03
    platform: shopee
    adapter: playwright
    display_name: "Toolspartner"
    web_shop_name: "Toolspartner"
    profile_key: shopee_03
    account_key: SHOPEE_03
    enabled: true                   # เปิดกลับ 2026-08-05 — เจ้าของร้านเปิดสิทธิ์ดาวน์โหลดให้แล้ว

  - shop_id: shopee_08
    platform: shopee
    adapter: playwright
    display_name: "TNLTOOLSTORE"
    web_shop_name: "TNLTOOLSTORE"
    profile_key: shopee_03          # ใช้ session เดียวกับ Toolspartner
    account_key: SHOPEE_03
    enabled: true                   # เปิดกลับ 2026-08-05 — เจ้าของร้านเปิดสิทธิ์ดาวน์โหลดให้แล้ว

  - shop_id: shopee_04
    platform: shopee
    adapter: playwright
    display_name: "Powerstools"
    account_key: SHOPEE_04
    enabled: true

  - shop_id: shopee_05
    platform: shopee
    adapter: playwright
    display_name: "เฮียเก๋า เครื่องมือช่างราคาถูก"
    account_key: SHOPEE_05
    enabled: true

  - shop_id: shopee_06
    platform: shopee
    adapter: playwright
    display_name: "กัปตัน เอกสตีล"
    account_key: SHOPEE_06
    enabled: true

  # ── ร้านใหม่ เพิ่ม 2026-08-09 ──────────────────────────────
  #
  # ⚠️ shopee_09 / shopee_10 เป็น "รหัสที่ถูกนำมาใช้ซ้ำ" ตามที่เจ้าของงานกำหนด
  #    รหัสเดียวกันนี้เคยเป็นของ Yong House / บ้านช่าง ซึ่งเป็นคนละร้านกันสิ้นเชิง
  #    และเป็นร้านที่ไม่ยินยอมให้ดึงข้อมูล (ดูหมายเหตุท้ายไฟล์)
  #    ร้านเก่าไม่เคยดึงสำเร็จเลยสักรอบ จึงไม่มีข้อมูลปนกัน
  #
  # ยังไม่รู้ว่า 3 ร้านนี้อยู่บัญชีเดียวกันหรือแยกกัน จึงให้แต่ละร้านมีโปรไฟล์ของตัวเองไปก่อน
  # ถ้าล็อกอินแล้วพบว่าอยู่บัญชีเดียวกัน ค่อยรวม profile_key ทีหลังจะได้ล็อกอินครั้งเดียว
  # 2 ร้านนี้เป็นร้านเดียวกัน (แบรนด์ "นาดา") เหมือนกรณี Toolspartner + TNLTOOLSTORE
  # display_name = ชื่อจริงบนเว็บ ห้ามใส่ "นาดา" ต่อท้าย เพราะค่านี้ถูกใช้จับคู่แถวร้าน
  # ในหน้า /portal/shop ด้วย ถ้าไม่ตรงเป๊ะจะกดผิดร้านหรือหาไม่เจอ
  - shop_id: shopee_09
    platform: shopee
    adapter: playwright
    display_name: "Superhomefactory"
    account_key: SHOPEE_09
    enabled: true

  - shop_id: shopee_10
    platform: shopee
    adapter: playwright
    display_name: "DIY tools ขายเครื่องมือช่าง"
    account_key: SHOPEE_10
    enabled: true

  - shop_id: shopee_11
    platform: shopee
    adapter: playwright
    display_name: "Jumbo A"
    account_key: SHOPEE_11
    enabled: true

  # ── เอาออกแล้ว 2026-08-05 — เจ้าของร้านไม่ยินยอมให้ดึงข้อมูล ──────────
  #
  # shopee_07  Yonghouse Official Store
  # shopee_09  Yong House ยงเฮ้าส์        ← รหัสถูกนำไปใช้กับ "นาดา 1" แล้ว
  # shopee_10  บ้านช่าง Baanchang         ← รหัสถูกนำไปใช้กับ "นาดา 2" แล้ว
  #
  # ทั้ง 3 ร้านอยู่ใต้บัญชี YM_SP:Osuka (ใช้ profile_key เดียวกัน)
  # เจ้าของงานคุยกับทางร้านแล้ว ทางร้านไม่ต้องการให้เราดึงข้อมูล
  #
  # ⚠️ ห้ามเพิ่ม 3 ร้านนี้กลับเข้ามาเด็ดขาด — ที่รหัส 09/10 มีอยู่ตอนนี้คือ "นาดา"
  #    ซึ่งเป็นคนละร้าน ไม่ใช่การเอาร้านเดิมกลับมา
  #
  # ⚠️ ต่างจากร้านที่ตั้ง enabled: false ตรงที่อันนั้นคือ "ติดปัญหาเทคนิค รอแก้"
  #    แต่ 3 ร้านนี้คือ "ไม่ได้รับความยินยอม" — ห้ามเปิดกลับเองเด็ดขาด
  #    ถ้าวันหนึ่งทางร้านอนุญาต ต้องได้รับการยืนยันจากเจ้าของงานก่อนเท่านั้น
