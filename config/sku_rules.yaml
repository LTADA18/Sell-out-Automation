# กฎจับคู่ SKU ที่เจ้าของงานไกด์ไว้ — ถอดจากช่อง "ข้อเสนอแนะ" ในไฟล์ไกด์ SKU
#
# ใช้กับสินค้า OSUKA ที่ระบบสกรีนจับคู่กับตัวกลาง SML ไม่ได้
# เติมกฎใหม่ได้เรื่อย ๆ ไม่ต้องแก้โค้ด — scripts/apply_sku_guide.py อ่านไฟล์นี้
#
# ลำดับสำคัญ: ตรวจจากบนลงล่าง เจอกฎแรกที่เข้าเงื่อนไขแล้วหยุด
# กฎที่เจาะจงกว่าต้องอยู่บนกฎที่กว้างกว่า
#
# เงื่อนไขที่ใช้ได้
#   name_has      ชื่อสินค้าต้องมีคำใดคำหนึ่งในลิสต์
#   name_not      ชื่อสินค้าต้องไม่มีคำเหล่านี้เลย
#   var_has       variation ต้องมีคำใดคำหนึ่ง
#   var_not       variation ต้องไม่มีคำเหล่านี้
#   sku_has       sku ของร้านต้องมีคำใดคำหนึ่ง
# เทียบแบบไม่สนตัวพิมพ์เล็กใหญ่ และยุบช่องว่างก่อนเทียบเสมอ

# ⚠️ วลีปฏิเสธ — ตัดทิ้งก่อนเทียบ ไม่งั้นคำปฏิเสธจะถูกอ่านเป็นคำยืนยัน
#    "พัดลมไร้สาย OCF-762 ไม่มีไอน้ำ" มีคำว่า "ไอน้ำ" อยู่ข้างใน
#    ถ้าไม่ตัดก่อน จะถูกจับเป็นรุ่นไอน้ำ OCF763 ทั้งที่เป็น OCF762
strip_phrases:
  - ไม่มีไอน้ำ
  - ไม่มีไอนํ้า
  - ไม่มีแบต
  - ไม่รวมแบต

rules:

  # ---------------------------------------------------------------
  # ร้านจัดเซ็ตเอง — จับคู่กับ SKU เดี่ยวไม่ได้ ต้องตัดออกจากคิวรีวิว
  # ไม่ใช่ของที่ยังไม่ได้ทำ แต่เป็นของที่ทำไม่ได้โดยธรรมชาติ
  # ต้องอยู่บนสุด เพราะชื่อมันมีรหัสรุ่นเต็มไปหมด เดี๋ยวไปเข้ากฎอื่น
  # ---------------------------------------------------------------
  - id: shop_bundle
    label: ร้านจัดเซ็ตเอง
    verdict: ไม่ใช่สินค้าเดี่ยว
    note: ร้านเอาสินค้าหลายตัวมาจัดเซ็ตเอง ไม่มี SKU เดี่ยวให้จับคู่
    any:
      - sku_has:  ["OSID520-OSAF3211", "OSID-520+OSAF3211", "OSID831-M1-OSAF3211", "OSK8614"]
      - var_has:  ["520+ลูกบล็อก", "831-M1+ลูกบล็อก", "บล็อก 520 + ลูกบล็อก", "OSID-520+OSAF3211"]

  # ---------------------------------------------------------------
  # เลื่อย/กรรไกร + ด้ามต่อ — ตารางที่เจ้าของงานให้มาเต็ม ๆ
  # ต้องอยู่เหนือกฎเลื่อย OCMC536 เดี่ยว เพราะเจาะจงกว่า
  # ---------------------------------------------------------------
  - id: pole_saw_536_265
    sku: AOSK0207
    model: OCMC536-M1+OCMC2536
    all:
      - var_has: ["เลื่อย"]
      - var_has: ["ด้าม"]
      - var_not: ["กรรไกร", "4 เมตร", "4เมตร", "V.2"]
  - id: pole_shear_451_265
    sku: AOSK0208
    model: OCMPP451-D1+OCMC2536
    all:
      - var_has: ["กรรไกร"]
      - var_has: ["ด้าม"]
      - var_not: ["เลื่อย", "4 เมตร", "4เมตร"]
  - id: pole_saw_shear_265
    sku: AOSK0209
    model: OCMC536-M1+OCMPP451-N+OCMC2536
    all:
      - var_has: ["เลื่อย"]
      - var_has: ["กรรไกร"]
      - var_has: ["ด้าม"]
      - var_not: ["4 เมตร", "4เมตร"]

  # ---------------------------------------------------------------
  # พัดลมไร้สาย OCF762 / OCF763 (ไอน้ำ)
  # ---------------------------------------------------------------
  - id: fan_mist_bare
    sku: ""
    model: OCF763-N
    all:
      - name_has: ["พัดลม"]
      - name_has: ["ไอน้ำ"]
      - var_has:  ["ตัวเปล่า"]
  - id: fan_mist_batt
    sku: ""
    model: OCF763-M1
    all:
      - name_has: ["พัดลม"]
      - name_has: ["ไอน้ำ"]
      - var_has:  ["พร้อมแบต", "+แบต", "แบต 4"]
  - id: fan_bare
    sku: ""
    model: OCF762-N
    all:
      - name_has: ["พัดลมไร้สาย", "พัดลม"]
      - name_not: ["ไอน้ำ"]
      - var_has:  ["ตัวเปล่า"]
  - id: fan_batt
    sku: AOSK0280
    model: OCF762-M1
    all:
      - name_has: ["พัดลมไร้สาย", "พัดลม"]
      - name_not: ["ไอน้ำ"]
      - var_has:  ["พร้อมแบต", "+แบต", "แบต 4"]

  # ---------------------------------------------------------------
  # สว่านไร้สาย / สว่านกระแทก OCHD802
  # ---------------------------------------------------------------
  - id: drill_802_d2
    sku: AOSK0071
    model: OCHD802-D2
    all:
      - name_has: ["สว่านไร้สาย", "สว่านกระแทก", "OCHD802"]
      - var_has:  ["แบต 2 ก้อน", "แบต2ก้อน"]
  - id: drill_802_d1
    sku: ""
    model: OCHD802-D1
    all:
      - name_has: ["สว่านไร้สาย", "สว่านกระแทก", "OCHD802"]
      - var_has:  ["แบต 1 ก้อน", "แบต1ก้อน"]
  - id: drill_802_n
    sku: ""
    model: OCHD802-N
    all:
      - name_has: ["สว่านไร้สาย", "สว่านกระแทก", "OCHD802"]
      - var_has:  ["ตัวเปล่า"]

  # ---------------------------------------------------------------
  # หินเจียรไร้สาย OCAG746
  # ---------------------------------------------------------------
  - id: grinder_746
    sku: AOSK0319
    model: OCAG746-E1
    all:
      - name_has: ["OCAG746", "หินเจียรไร้สาย", "เครื่องเจียร"]
      - var_has:  ["พร้อมแบต"]

  # ---------------------------------------------------------------
  # เลื่อยไฟฟ้าไร้สาย OCMC536 เดี่ยว
  # อุปกรณ์ครบชุดพร้อมใช้ = พร้อมแบต
  # เจ้าของงานสั่งว่าถ้ากำกวมระหว่าง M1 กับ K1 ให้ใส่ M1 ไว้ก่อน
  # ---------------------------------------------------------------
  - id: saw_536_m1
    sku: JOSK0031
    model: OCMC536-M1
    note: กำกวมระหว่าง M1 กับ K1 เจ้าของงานสั่งให้ใส่ M1 ไว้ก่อน
    all:
      - name_has: ["OCMC536", "เลื่อยไฟฟ้าไร้สาย"]
      - var_has:  ["อุปกรณ์ครบชุดพร้อมใช้", "พร้อมแบต", "ครบชุด"]

  # ---------------------------------------------------------------
  # เลื่อยตัดแต่งกิ่ง OCPS427
  # ---------------------------------------------------------------
  - id: pruner_427
    sku: JOSK0048
    model: OCPS427-D1
    all:
      - name_has: ["OCPS427", "OSPS 427", "OSPS427", "OCPS 427"]

  # ---------------------------------------------------------------
  # แม่แรง OSFJ / ขาตั้ง OSH
  # ---------------------------------------------------------------
  - id: jack_25
    sku: KOSK0025
    model: OSFJ-2.5T
    all:
      - name_has: ["แม่แรง", "ตะเข้"]
      - var_has:  ["2.5"]
  - id: jack_3
    sku: KOSK0018
    model: OSH-003
    all:
      - name_has: ["แม่แรง", "ขาตั้ง", "ตะเข้"]
      - var_has:  ["3 ตัน", "3T", "ขาตั้ง 3"]

  # ---------------------------------------------------------------
  # แบตเตอรี่ — ระวัง Supreme / Tabless ยังไม่มีไกด์ ต้องกันไว้
  # ---------------------------------------------------------------
  # ⚠️ ต้องเป็นแบตเปล่าจริง ๆ ไม่ใช่เครื่องมือที่พ่วงแบตมา
  #    "OCF762 + ชุดแบต4.0Ah" คือพัดลมพ่วงแบต ไม่ใช่แบตเปล่า
  #    ถ้าไม่กันไว้ จะถูกจับเป็น OCB-204 แล้วยอดพัดลมหายไปเป็นยอดแบต
  - id: battery_4ah_needs_guide
    verdict: ต้องใช้ไกด์แบต
    note: มีคำว่า Supreme หรือ Tabless เจ้าของงานบอกว่าต้องดูไกด์แบตอีกชุด ซึ่งยังไม่ได้ให้มา
    all:
      - name_has: ["แบตเตอรี่"]
      - name_not: ["พัดลม", "สว่าน", "เลื่อย", "หินเจียร", "บล็อก", "กรรไกร", "ไขควง", "แม่แรง"]
      - var_has:  ["4.0 Ah", "4.0Ah", "4 Ah", "4Ah"]
      - any_of_words_in_name_or_var: ["supreme", "tabless"]
  - id: battery_4ah
    sku: AOSK0081
    model: OCB-204
    all:
      - name_has: ["แบตเตอรี่"]
      - name_not: ["พัดลม", "สว่าน", "เลื่อย", "หินเจียร", "บล็อก", "กรรไกร", "ไขควง", "แม่แรง"]
      - var_has:  ["4.0 Ah", "4.0Ah", "4 Ah", "4Ah"]
      - var_not:  ["+", "ocf", "ochd", "ocmc", "osid", "ชุด"]

  # ---------------------------------------------------------------
  # กล่องเครื่องมือ ชุดรวม 23101-05
  # เจ้าของงานย้ำว่า 01-05 คือรุ่นเดียว ไม่ใช่ 01 ถึง 05
  # ---------------------------------------------------------------
  - id: toolbox_set_2310105
    sku: AOSK0141
    model: OSMMS23101-05
    note: 23101-05 คือชุดรวมกล่อง เป็นรุ่นเดียว ไม่ใช่ 01 ถึง 05
    all:
      - name_has: ["กล่องเครื่องมือ"]
      - var_has:  ["23101-05", "ครบเซท"]
