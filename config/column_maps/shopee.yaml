# ─────────────────────────────────────────────────────────────
#  Shopee Seller Centre — ไฟล์ Export จากหน้าคำสั่งซื้อ (77 คอลัมน์)
#  อ้างอิงจากไฟล์จริง: Order.all.order_creation_date.20260803_20260803.xlsx
#  (shopee_02 Smarttooltech, 484 แถว / 409 ออเดอร์, ดึงเมื่อ 2026-08-04)
# ─────────────────────────────────────────────────────────────

export_flow:
  order_list_url: "{base}/portal/sale/order"
  # 1 บัญชีดูแลได้หลายร้าน — มีหน้า /portal/shop คั่น ต้องกดปุ่ม "รายละเอียด"
  # ของแถวที่ตรงกับ web_shop_name ก่อน (ดู ShopeeAdapter._enter_shop)
  shop_selector_page: "{base}/portal/shop"
  # ⚠️ div.onboarding-masked ทัวร์แนะนำฟีเจอร์ ดักคลิกทั้งหน้า ต้องปิดก่อนเสมอ
  has_onboarding_overlay: true
  # เหมือน TikTok: กดแล้วเข้าคิว ต้อง poll รอในแผง "รายงานล่าสุด"
  async_export: true
  poll_history_panel: true
  # ชื่อไฟล์บอกช่วงวันที่ในตัว ใช้ยืนยันว่าได้ไฟล์ของรอบนี้จริง
  filename_pattern: "Order.<scope>.order_creation_date.<YYYYMMDD>_<YYYYMMDD>.xlsx"
  export_format: Excel

file:
  sheet: orders
  header_row: 1
  data_start_row: 2

# "2026-08-03 00:00" — ไม่มีวินาที
# บางคอลัมน์เป็นวันที่ล้วน ("2026-08-03") column_map จะ fallback ให้เอง
datetime_format: "%Y-%m-%d %H:%M"

# ─────────────────────────────────────────────────────────────
#  ✅ เปิดใช้คอลัมน์การเงินแล้ว — เจ้าของงานอนุญาต 2026-08-11
#     (เดิมปิดไว้ตั้งแต่ 2026-08-04 ตอนสั่งพัก Phase 5)
#
#     ⚠️ settlement_amount ยังเป็น "Null" ต่อไป เพราะรายงานออเดอร์ไม่มีคอลัมน์นี้
#        ที่ใกล้ที่สุดคือ "วันที่เงินเข้า Seller Balance" ซึ่งเป็นวันที่ ไม่ใช่ยอดเงิน
#        ยอด settlement จริงอยู่ในเมนูการเงิน ซึ่งยังไม่ได้เปิดให้ระบบเข้า
#        ห้ามเอาคอลัมน์อื่นมาใส่แทนโดยเดา
#
#     กฎเหล็กข้อ 1 ยังใช้อยู่ — ไม่มีข้อมูล = "Null" ห้ามสร้างตัวเลขขึ้นเอง
# ─────────────────────────────────────────────────────────────

fields:
  order_id:          ["หมายเลขคำสั่งซื้อ"]
  status_raw:        ["สถานะการสั่งซื้อ"]
  return_status:     ["สถานะการคืนเงินหรือคืนสินค้า"]
  cancel_reason:     ["เหตุผลในการยกเลิกคำสั่งซื้อ"]

  order_created_at:  ["วันที่ทำการสั่งซื้อ"]
  paid_at:           ["เวลาการชำระสินค้า"]
  shipped_at:        ["เวลาส่งสินค้า"]
  delivered_at:      ["วันที่จัดส่งสำเร็จ"]
  order_updated_at:  ["วันที่จัดส่งสำเร็จ", "เวลาส่งสินค้า"]
  # ⚠️ เดิม shipped_at / delivered_at ถูกยุบรวมเป็น order_updated_at ค่าเดียวแล้วทิ้ง
  #    ตั้งแต่ 2026-08-13 เก็บแยกช่องด้วย ไม่งั้นตามรอยเวลาส่ง/เวลาถึงไม่ได้
  promised_ship_at:  ["วันที่คาดว่าจะทำการจัดส่งสินค้า"]
  completed_at:      ["เวลาที่ทำการสั่งซื้อสำเร็จ"]
  cancelled_at:      ["วันที่คำสั่งซื้อถูกยกเลิก"]
  settlement_date:   ["วันที่เงินเข้า Seller Balance"]

  payment_method:    ["ช่องทางการชำระเงิน"]
  shipping_carrier:  ["ตัวเลือกการจัดส่ง"]
  shipping_method:   ["วิธีการจัดส่ง"]
  tracking_no:       ["*หมายเลขติดตามพัสดุ", "หมายเลขติดตามพัสดุ"]

  sku:               ["เลขอ้างอิง SKU (SKU Reference No.)"]
  parent_sku:        ["เลขอ้างอิง Parent SKU"]
  product_name:      ["ชื่อสินค้า"]
  variation:         ["ชื่อตัวเลือก"]
  quantity:          ["จำนวน"]
  returned_qty:      ["จำนวนที่ส่งคืน"]

  # ราคาตั้งต้น = ราคาก่อนลด / ราคาขาย = ราคาที่ตั้งขายจริง
  item_price:        ["ราคาตั้งต้น"]
  deal_price:        ["ราคาขาย"]
  net_price:         ["ราคาขายสุทธิ"]
  seller_discount:   ["โค้ดส่วนลดชำระโดยผู้ขาย"]
  platform_discount: ["ส่วนลดจาก Shopee"]
  shipping_fee:      ["ค่าจัดส่งที่ชำระโดยผู้ซื้อ"]
  total_amount:      ["จำนวนเงินทั้งหมด"]

  # ── ส่วนลดที่เหลือ เปิดใช้ 2026-08-13 ────────────────────────
  # ⚠️ เดิมอ่านแค่ 2 ช่องจาก 11 ช่อง ทำให้ platform_discount ต่ำกว่าจริงราว 44 เท่า
  #    วัดจากไฟล์จริง 3,366 แถว: "โค้ดส่วนลดชำระโดย Shopee" 1,220,435 บาท
  #    ขณะที่ "ส่วนลดจาก Shopee" ที่เราอ่านอยู่มีแค่ 37,090 บาท
  #
  # ⚠️ ห้ามบวกรวมช่องพวกนี้เข้า seller_discount / platform_discount เอง
  #    ทดสอบแล้วไม่มีช่องไหนเป็นผลรวมของช่องอื่น ("โค้ดส่วนลด" = 0 ทุกแถว)
  #    บวกเองเมื่อไหร่คือสร้างตัวเลขขึ้นเอง ผิดกฎเหล็กข้อ 1
  seller_voucher:          ["โค้ดส่วนลดชำระโดยผู้ขาย"]
  seller_coin_cashback:    ["โค้ด Coins Cashback ชำระโดยผู้ขาย"]
  seller_bundle_discount:  ["ส่วนลด bundle deal ชำระโดยผู้ขาย"]
  seller_tradein_bonus:    ["โบนัสส่วนลดเครื่องเก่าแลกใหม่จากผู้ขาย"]
  platform_voucher:        ["โค้ดส่วนลดชำระโดย Shopee (เช่น โค้ดจากโปรแกรม ร้านโค้ดคุ้ม, โค้ดส่วนลด Shopee, โค้ดส่วนลด Shopee Mall)",
                            "โค้ดส่วนลดชำระโดย Shopee"]
  platform_bundle_discount: ["ส่วนลด bundle deal ชำระโดย Shopee"]
  coin_discount:           ["ส่วนลดจากการใช้เหรียญ"]
  payment_discount:        ["โปรโมชั่นช่องทางชำระเงินทั้งหมด"]
  tradein_discount:        ["ส่วนลดเครื่องเก่าแลกใหม่"]
  tradein_bonus:           ["โบนัสส่วนลดเครื่องเก่าแลกใหม่"]
  voucher_total:           ["โค้ดส่วนลด"]

  # ── เงินก้อนอื่นที่เดิมไม่ได้อ่าน ─────────────────────────────
  # ⚠️ ราคาสินค้าที่ชำระโดยผู้ซื้อ เป็นค่าระดับ "ออเดอร์" ซ้ำทุกบรรทัด ห้ามบวกข้ามบรรทัด
  #    ยืนยัน 2026-08-13: ราคาสินค้าที่ชำระโดยผู้ซื้อ + ค่าจัดส่ง = จำนวนเงินทั้งหมด ตรง 514/514
  item_paid_by_buyer:      ["ราคาสินค้าที่ชำระโดยผู้ซื้อ (THB)"]
  estimated_shipping_fee:  ["ค่าจัดส่งโดยประมาณ"]
  return_shipping_fee:     ["ค่าจัดส่งสินค้าคืน"]
  installation_fee_buyer:  ["ค่าติดตั้งที่ชำระโดยผู้ซื้อ"]
  installation_fee_actual: ["ค่าติตตั้งตามจริง คิดโดยผู้ให้บริการ",
                            "ค่าติดตั้งตามจริง คิดโดยผู้ให้บริการ"]

  # ── ธง/ประเภท ────────────────────────────────────────────────
  order_type:            ["ประเภทคำสั่งซื้อ"]
  fulfilled_by_platform: ["คำสั่งซื้อที่ดำเนินการโดย Shopee"]
  owned_by_platform:     ["Shopee เป็นเจ้าของ"]
  in_bundle_deal:        ["เข้าร่วมแคมเปญ bundle deal หรือไม่"]
  hot_listing:           ["Hot Listing"]
  tax_invoice_requested: ["ผู้ซื้อร้องขอใบกำกับภาษี"]
  tax_invoice_type:      ["ประเภทใบกำกับภาษี"]
  seller_note:           ["บันทึก"]

  # พื้นที่ระดับเขต/ประเทศ — ไม่ใช่ที่อยู่จริง จึงเก็บได้
  district:              ["เขต/อำเภอ"]
  country:               ["ประเทศ"]

  # ── การเงิน (เปิดใช้ 2026-08-11) ────────────────────────────
  # ทั้ง 3 ตัวเป็นค่าธรรมเนียมที่ Shopee หักจากผู้ขาย เป็นเลขบวกในไฟล์
  commission_fee:    ["ค่าคอมมิชชั่น"]
  transaction_fee:   ["Transaction Fee"]
  service_fee:       ["ค่าบริการ"]

  buyer_username:    ["ชื่อผู้ใช้ (ผู้ซื้อ)"]
  province:          ["จังหวัด"]
  postcode:          ["รหัสไปรษณีย์"]

# ค่าที่โผล่จริงในไฟล์ (นับจาก 484 แถว)
status_map:
  "ยังไม่ชำระ": PENDING                          # 4
  "ที่ต้องจัดส่ง": READY_TO_SHIP                  # 176
  "การจัดส่ง": SHIPPED                            # 193
  "จัดส่งสำเร็จแล้ว": DELIVERED                   # 28
  "ผู้ซื้อได้รับสินค้าแล้ว": DELIVERED            # 9 (ข้อความจริงยาวกว่านี้ ใช้ขึ้นต้นพอ)
  "ยกเลิกแล้ว": CANCELLED                         # 74

# ⚠️ ต้องตัดทิ้งก่อนเก็บลง data/raw/ — Shopee ให้ PII มาเยอะกว่า Lazada อีก
#    มีทั้งชื่อ-ที่อยู่-เบอร์โทร และข้อมูลใบกำกับภาษี (เลขประจำตัวผู้เสียภาษี)
pii_columns:
  - "ชื่อผู้รับ"
  - "หมายเลขโทรศัพท์"
  - "หมายเหตุจากผู้ซื้อ"
  - "ที่อยู่ในการจัดส่ง"
  - "เขต/อำเภอ"
  - "ชื่อ"
  - "ประเภทสาขา"
  - "ชื่อสาขา"
  - "รหัสประจำสาขา"
  - "ที่อยู่สำหรับออกใบกำกับภาษีแบบเต็มรูป"
  - "รายละเอียดที่อยู่"
  - "แขวง/ตำบล"
  - "หมายเลขประจำตัวผู้เสียภาษี"
  - "หมายเลขโทรศัพท์สำหรับออกใบกำกับภาษี"
  - "อีเมลสำหรับรับใบกำกับภาษี"

quirks:
  ไม่ประกาศ_dimension: >
    เหมือน Lazada เป๊ะ — openpyxl เห็นแค่ 1 คอลัมน์ถ้าไม่ ws.reset_dimensions()
    ของจริงมี 77 คอลัมน์

  มี_quantity_ให้: >
    ต่างจาก Lazada ที่ออก 1 แถวต่อ 1 ชิ้น — Shopee มีคอลัมน์ "จำนวน" ให้ตรง ๆ
    แต่ค่าเป็น string ("1") ต้อง to_float ก่อนใช้

  หลาย_SKU_ต่อออเดอร์: >
    484 แถว = 409 ออเดอร์ มี 54 ออเดอร์ที่มีมากกว่า 1 แถว (หลาย SKU)
    total_amount เป็นยอดระดับออเดอร์ ซ้ำทุกแถวของออเดอร์เดียวกัน
    ตอนรวมยอดต้อง dedupe ด้วย order_id ก่อน ไม่งั้นเบิ้ล

  จังหวัด_มีคำนำหน้า: >
    ค่าเป็น "จังหวัดชัยภูมิ" ไม่ใช่ "ชัยภูมิ" — ถ้าจะ join กับตารางอื่นต้องตัดคำว่า
    "จังหวัด" ออกก่อน (ยังไม่ได้ทำใน normalize)

  สถานะคืนสินค้าว่างหมด: >
    ในไฟล์ตัวอย่างคอลัมน์ "สถานะการคืนเงินหรือคืนสินค้า" ว่างทั้ง 484 แถว
    ยังไม่เคยเห็นค่าจริง จึงยังไม่รู้ว่าหน้าตาเป็นยังไง

  ค่าธรรมเนียมมีในไฟล์แต่ไม่ได้ map: >
    คอลัมน์ 41 ค่าคอมมิชชั่น / 42 Transaction Fee / 46 ค่าบริการ มีข้อมูลอยู่จริง
    เจ้าของงานสั่งไม่ให้ยุ่งกับส่วนการเงิน (2026-08-04) จึงตั้งใจไม่ map
