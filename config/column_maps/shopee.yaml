# ─────────────────────────────────────────────────────────────
#  Shopee Seller Centre — ⚠️ ยังเป็นโครงเปล่า ยังใช้ดึงข้อมูลไม่ได้
#
#  ไฟล์นี้มีไว้เพื่อให้ล็อกอินเก็บ session ได้ก่อนเท่านั้น
#  (PlatformMap ต้องมีไฟล์ {platform}.yaml ไม่งั้นสร้าง adapter ไม่ได้เลย)
#
#  จะเติมได้ต่อเมื่อมี "ไฟล์ Export จริง" จากหลังบ้าน Shopee มาดูก่อน
#  ห้ามเดาชื่อคอลัมน์เอาเอง — เดาผิดแล้วตัวเลขจะผิดแบบเงียบ ๆ
#  (กฎเหล็กข้อ 1: ห้ามสร้างตัวเลขขึ้นเอง)
#
#  ขั้นตอนตอนได้ไฟล์ตัวอย่างมาแล้ว:
#    1. ดูว่าหัวตารางอยู่แถวไหน ข้อมูลเริ่มแถวไหน -> file:
#    2. จับคู่ชื่อคอลัมน์ดิบ -> fields:
#    3. จดสิ่งที่กัดไว้ใน quirks: (เช่น 1 แถวต่อ 1 ชิ้นแบบ Lazada หรือเปล่า)
#    4. เขียน status_map: จากค่าสถานะที่โผล่จริงในไฟล์
# ─────────────────────────────────────────────────────────────

export_flow:
  # ยังไม่ได้สำรวจหน้าจริง — ค่าพวกนี้เป็นที่ว่างไว้เติม
  order_list_url: ""
  async_export: null
  poll_history_panel: null

file:
  header_row: 1
  data_start_row: 2

datetime_format: ""

# ว่างไว้ตั้งใจ — normalize() ของ ShopeeAdapter จะปฏิเสธการทำงาน
# ตราบใดที่ fields ยังว่าง จะได้ไม่มีทางออก Excel ที่มีข้อมูลผิดออกมาได้
fields: {}

status_map: {}

# คอลัมน์ที่เป็นข้อมูลส่วนบุคคล — ตัดทิ้งก่อนเก็บลง data/raw/
# เติมให้ครบตอนเห็นไฟล์จริง (Lazada มี customerName / nationalRegistrationNumber)
pii_columns: []

quirks:
  สถานะ: "ยังไม่เคยเห็นไฟล์ Export จริง — ทุกอย่างในไฟล์นี้ยังไม่ได้ยืนยัน"
