# ─────────────────────────────────────────────────────────────
#  Shopee Ads — ไฟล์ "รายงานโฆษณา CPC ทั้งหมด" (36 คอลัมน์)
#  อ้างอิงจากไฟล์จริง: ข้อมูล-Shopee-Ads-01/07/2026-31/07/2026.csv
#  (shopee_02 Smarttooltech, 33 แถว, ดึงเมื่อ 2026-08-22)
#
#  ปลายทางคือตาราง intel.mp_ads_raw บน Postgres ซึ่งเจ้าของงานสร้างรอไว้แล้ว
#  ชื่อช่องทางขวาของ map คือชื่อคอลัมน์ในตารางนั้นตรง ๆ
# ─────────────────────────────────────────────────────────────

export_flow:
  ads_url: "{base}/portal/marketing/pas/index"
  # 1 บัญชีดูแลได้หลายร้าน ต้องผ่านหน้าเลือกร้านก่อนเหมือนหน้าออเดอร์
  shop_selector_page: "{base}/portal/shop"
  has_onboarding_overlay: true
  # กดแล้วเข้าคิว ไม่ได้ไฟล์ทันที ต้องไปรอที่แผง "รายงานล่าสุด"
  # (ยืนยันแล้ว 2026-08-22 — กดปุ่มแล้วรอตรงนั้น 3 นาทีไฟล์ไม่มา)
  async_export: true
  # ไอคอนเปิดแผงประวัติ — แผงเก็บ 10 ไฟล์ล่าสุดที่ยังไม่ได้โหลด ย้อนหลัง 6 เดือน
  history_icon: "i.download-list-icon"
  # ปุ่มเปิดเมนูดาวน์โหลด แล้วเลือก 1 ใน 2 รายการข้างล่าง
  download_button: 'button:has-text("ดาวน์โหลดข้อมูล")'
  menu_ads_data: "ข้อมูลโฆษณาคำค้นหา"
  menu_keyword_rank: "ข้อมูลอันดับ Keyword"
  # ชื่อไฟล์ในประวัติ — ใช้ยืนยันว่าได้ไฟล์ของช่วงที่ขอจริง
  filename_pattern: "ข้อมูล-Shopee-Ads-<DD/MM/YYYY>-<DD/MM/YYYY>.csv"
  export_format: CSV

file:
  encoding: utf-8-sig
  # แถว 1-7 เป็นหัวไฟล์ (ชื่อร้าน / Shop ID / ช่วงเวลา) ไม่ใช่ข้อมูล
  # หัวตารางจริงอยู่แถว 8 — อย่าฝังเลขนี้ไว้ในโค้ด ให้หาแถวที่มีคอลัมน์ > 5 เอา
  # เผื่อ Shopee เพิ่มบรรทัดหัวไฟล์ทีหลัง
  header_row: 8
  data_start_row: 9
  find_header_by_width: true

# ─────────────────────────────────────────────────────────────
#  จับคู่คอลัมน์ → ช่องใน intel.mp_ads_raw
# ─────────────────────────────────────────────────────────────
fields:
  ad_name:              ["ชื่อโฆษณา"]
  ad_status:            ["สถานะ"]
  ads_type:             ["ประเภทโฆษณา"]
  sml_product_id:       ["รหัสสินค้า"]
  sml_match_type:       ["การตั้งราคาประมูล"]
  match_type:           ["ตำแหน่ง"]
  # มีเฉพาะในรายงานคำค้นหา (30 คอลัมน์) ไม่มีในรายงานโฆษณาทั้งหมด (36 คอลัมน์)
  keyword:              ["Keywords"]

  impressions:          ["การมองเห็น"]
  clicks:               ["จำนวนคลิก"]
  ctr:                  ["อัตราการคลิก (CTR)"]
  conversions:          ["การสั่งซื้อ"]
  direct_conversions:   ["การสั่งซื้อโดยตรง"]
  conv_rate:            ["อัตราการสั่งซื้อ"]
  cost_per_conv_thb:    ["ราคาต่อการสั่งซื้อ"]
  items_sold:           ["สินค้าที่ขายแล้ว"]
  gmv_thb:              ["ยอดขาย"]
  direct_gmv_thb:       ["ยอดขายโดยตรง"]
  expense_thb:          ["ค่าโฆษณา"]
  roas:                 ["ยอดขาย/รายจ่าย (ROAS)"]
  acos:                 ["ACOS"]

# ยังไม่มีในไฟล์ไหนเลย — ปล่อยเป็นค่าว่างตามกฎเหล็กข้อ 1 ห้ามเดาแทน
# campaign_name : ทั้ง 2 รายงานมีแต่ "ชื่อโฆษณา" ซึ่งเป็นระดับโฆษณา ไม่ใช่ระดับแคมเปญ
unmapped:
  - campaign_name

# ─────────────────────────────────────────────────────────────
#  มี 2 รูปแบบไฟล์ ต้องรองรับทั้งคู่ (ยืนยันกับของจริง 2026-08-22)
#
#  A. "ข้อมูล-Shopee-Ads-..."      36 คอลัมน์ — โฆษณาทุกประเภทรวมกัน
#     มี ประเภทโฆษณา / รหัสสินค้า / ตำแหน่ง  แต่ไม่มี Keywords
#
#  B. "Shop+-Ads-Overall-Data-..." 30 คอลัมน์ — เฉพาะโฆษณาคำค้นหา
#     มี Keywords / ส่วนแบ่งการมองเห็น (SOV)  แต่ไม่มี ประเภทโฆษณา / รหัสสินค้า
#
#  แยกด้วยการดูว่ามีคอลัมน์ Keywords ไหม ไม่ใช่ดูจากชื่อไฟล์
#  (ชื่อไฟล์ Shopee เปลี่ยนรูปแบบมาแล้ว อย่ายึดเป็นหลัก)
#
#  ⚠️ ร้านที่ไม่ได้ยิงโฆษณาคำค้นหา ไฟล์ B จะมีหัวตารางแต่ไม่มีแถวข้อมูลเลย
#     นั่นคือ "ไม่มีโฆษณาแบบนั้น" ไม่ใช่ "ดึงพัง" ต้องรายงานแยกกันให้ชัด
#     (shopee_02 ช่วง 01-21/08/2026 เป็นแบบนี้)
# ─────────────────────────────────────────────────────────────
report_variants:
  all_ads:  { detect_missing: "Keywords", columns: 36 }
  keyword:  { detect_present: "Keywords", columns: 30 }

quirks:
  ไฟล์เป็นยอดรวมทั้งช่วง ไม่ใช่รายวัน: >
    ขอช่วง 01/07-31/07 จะได้ 1 แถวต่อ 1 โฆษณา เป็นยอดรวมทั้งเดือน
    ไม่ได้แยกรายวัน ตรงกับที่ mp_ads_raw มี period_from/period_to
    ถ้าต้องการรายวันต้องขอทีละวัน ซึ่งจะกินโควตาประวัติ 10 ไฟล์เร็วมาก

  ตัวเลขมีเครื่องหมาย % และ comma: >
    CTR / อัตราการสั่งซื้อ / ACOS มาเป็น "4.30%" ต้องตัด % แล้วหาร 100 เอง
    ยอดเงินบางตัวมี comma คั่นหลักพัน ต้องล้างก่อนแปลงเป็นตัวเลข

  แถว Shop GMV Max ไม่มีประเภทโฆษณา: >
    แถวที่ชื่อ "Shop GMV Max" มีคอลัมน์ประเภทโฆษณาว่าง และ
    การตั้งราคาประมูลเป็น "GMV Max Auto Bidding (Shop)" ต่างจากแถวอื่น
    เป็นโฆษณาระดับร้าน ไม่ใช่ระดับสินค้า — อย่าทิ้งแถวนี้
    ยอดของมันใหญ่ที่สุดในไฟล์ (ค่าโฆษณา 151,368 จาก 33 แถว)

  ประวัติเก็บแค่ 10 ไฟล์ที่ยังไม่ได้โหลด: >
    แผง "รายงานล่าสุด" บอกเองว่าเก็บ 10 รายงานล่าสุดที่ยังไม่ได้ดาวน์โหลด
    ในช่วง 6 เดือน — ขอถี่เกินไปไฟล์เก่าจะหลุดออกก่อนได้โหลด
