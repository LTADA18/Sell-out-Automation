# ─────────────────────────────────────────────────────────────
#  Lazada Sponsored Max — ไฟล์ "Storewide Overview" (4 คอลัมน์)
#  อ้างอิงจากไฟล์จริง: 100182681008-TNLTOOLSTORE-Storewide Overview-2026-08-22.xlsx
#  (lazada_02 TNLTOOLSTORE, ดึงเมื่อ 2026-08-22)
#
#  ปลายทางคือ intel.mp_ads_raw เหมือน Shopee/TikTok
# ─────────────────────────────────────────────────────────────

export_flow:
  # path จริงที่อ่านมาจาก href ในหน้า ไม่ได้เดา (เดาผิดจน 404 มาแล้ว 2 รอบ)
  report_url: "{base}/sponsor/solutions/ads/report/#!/campaignReport/2200"
  date_by_url: false
  async_export: false          # กดแล้วได้ไฟล์เลย ไม่มีคิวแบบ Shopee
  # ⚠️ ปุ่มเป็น <button> ที่มีข้อความ "ดาวน์โหลด" แต่แถบแท็บแบบลอยทับอยู่
  #    ต้องสั่ง .click() ที่ตัว element ตรง ๆ คลิกด้วยเมาส์ไม่ลง
  download_button_text: "ดาวน์โหลด"
  export_format: Excel

file:
  # แถว 1-4 เป็นหัวไฟล์ (Seller Id / Seller Name / Data Type / Timing)
  # หัวตารางจริงอยู่แถว 7 — หาแถวที่กว้างพอเอา อย่าฝังเลขไว้
  find_header_by_width: true
  needs_reset_dimensions: false

fields:
  period_day:      ["วันที่"]
  expense_thb:     ["ค่าใช้จ่าย"]
  gmv_thb:         ["ยอดรายได้"]
  conversions:     ["คำสั่งซื้อ"]

# ไม่มีในไฟล์นี้ — ต้องเป็น None ตามกฎเหล็กข้อ 1 ห้ามเดาแทน
#
# ⚠️ ตัวเลขพวกนี้ "มีอยู่บนหน้าจอ" แต่ไม่ไหลลงไฟล์
#    ทดสอบแล้ว 2026-08-22 ว่าติ๊ก "เลือกทั้งหมด" ในเมนูเลือกตัวชี้วัดก็ไม่ช่วย
#    และสลับไปแท็บ Store/Product ก็ยังได้ไฟล์ Storewide Overview เดิมทุกตัว
#    ถ้าอยากได้ต้องเขียนตัวอ่านตารางจากหน้าเว็บแทน ซึ่งยังไม่ได้ทำ
unmapped:
  - ad_name
  - campaign_name
  - keyword
  - match_type
  - ads_type
  - impressions
  - clicks
  - ctr
  - conv_rate
  - acos
  - roas
  - items_sold
  - direct_conversions
  - direct_gmv_thb
  - cost_per_conv_thb

quirks:
  เพดาน 90 วันต่อการดาวน์โหลดหนึ่งครั้ง: >
    หน้าเว็บประกาศเอง ดึงย้อนหลังตั้งแต่ ม.ค. ต้องแบ่งเป็นก้อนละไม่เกิน 90 วัน

  คอนเวอร์ชันขยับได้อีก 30 วัน: >
    หน้าเว็บบอกว่านับแบบคลิกครั้งสุดท้ายย้อนหลัง 30 วัน และรายงานตามวันที่ซื้อ
    ตัวเลขของวันเดิมจึงเปลี่ยนได้อีกถึง 30 วันหลังจากนั้น
    ต้องดึงทับซ้ำ ไม่ใช่ดึงครั้งเดียวจบ — ต่างจาก Shopee/TikTok ที่นิ่งกว่า

  วันที่ในไฟล์เป็น 20260815 ไม่มีขีดคั่น: >
    ต่างจาก TikTok ที่เป็น "2026-08-15 00:00:00"
    ตัวแปลงรับทั้ง 2 แบบอยู่แล้ว แต่ห้ามสมมติว่าเหมือนกัน

  Data Type บอกว่าไฟล์เป็นชุดไหน: >
    แถวที่ 3 ของหัวไฟล์เขียนว่า "Data Type: Storewide Overview"
    ใช้ตรวจได้ว่าได้ไฟล์ชุดที่ตั้งใจจริงไหม ถ้าวันหนึ่ง Lazada ยอมให้
    ดาวน์โหลดแยกตามแท็บ ค่านี้จะเปลี่ยน แล้วเราจะรู้ทันที
