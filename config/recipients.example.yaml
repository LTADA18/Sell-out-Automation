# ผู้รับอีเมล — คัดลอกเป็น recipients.yaml แล้วเติมที่อยู่จริง
#
#     copy config\recipients.example.yaml config\recipients.yaml
#
# ⛔ recipients.yaml อยู่ใน .gitignore โดยตั้งใจ — เป็นอีเมลของคนอื่น
#    ไม่ใช่ของเรา จึงไม่ควรขึ้น git ให้ใครก็ได้ที่เข้าถึง repo อ่านได้
#    ไฟล์ตัวอย่างนี้ (ที่คุณกำลังอ่าน) ขึ้น git ได้ เพราะไม่มีที่อยู่จริง
#
# ⚠️ นี่คือรายชื่อ "ที่เดียว" ของทั้งระบบ — send_report.ps1 / mailer.py /
#    keepalive.py อ่านจากไฟล์นี้ทั้งหมด ห้ามก๊อปรายชื่อไปแปะที่อื่นอีก
#    ของเดิมเก็บไว้ 2 ที่แล้วอัปเดตที่เดียว อีเมลรายวันจึงส่งถึงแค่ 5 คน
#    จาก 21 คนมาตลอดโดยไม่มีใครรู้ (เจอจริง 2026-08-19)
#
# ⚠️ ถ้าไฟล์จริงหาย ระบบจะหยุดพร้อมข้อความบอกวิธีแก้ ไม่ส่งอีเมลเปล่า ๆ
#    ออกไปหาศูนย์คน ตั้งใจให้พังแบบดัง เพราะอีเมลที่ "ส่งสำเร็จ" แต่ไม่ถึงใคร
#    ไม่มีสัญญาณอะไรเตือนเลย

# ── อีเมลรายงานยอดขายประจำวัน (Task 09:00) ────────────────────
report:
  # ผู้รับหลัก — ว่างไม่ได้
  to:
    - someone@example.com

  # สำเนาถึง — ว่างได้ถ้าส่งถึงคนเดียว
  #
  # ⚠️ ก่อนเพิ่มชื่อใหม่ ให้ยืนยันตัวสะกดกับ Exchange ก่อนเสมอ
  #    เคยเจอที่อยู่ที่ "ดูเหมือนถูก" แต่ Exchange แปลงไม่ได้ ส่งไปแล้วเงียบ
  #    ไม่มี bounce กลับมาด้วย กว่าจะรู้ว่าคนนั้นไม่เคยได้รับก็ผ่านไปหลายวัน
  #    send_report.ps1 ตรวจให้ทุกครั้งก่อนส่ง และมีธง -StrictRecipients
  #    สำหรับสั่งให้หยุดเลยถ้ามีที่อยู่ไหนยืนยันไม่ได้
  cc:
    - teammate1@example.com
    - teammate2@example.com

# ── อีเมลเตือนตอนระบบมีปัญหา ───────────────────────────────────
# ใช้ 2 กรณี: ดึงไม่ครบทุกร้าน (mailer.send_incomplete_alert)
#            และมีร้าน session หมดอายุต้องล็อกอินเอง (keepalive.py)
#
# ตั้งใจให้เป็นคนละชุดกับ report — การเตือนเป็นเรื่องของคนที่ลงมือแก้
# ไม่ใช่เรื่องของทุกคนที่ดูยอด ถ้าส่งหาทุกคนจะกลายเป็นเสียงรบกวน
# แล้วสุดท้ายไม่มีใครอ่าน
alert:
  to:
    - someone@example.com
